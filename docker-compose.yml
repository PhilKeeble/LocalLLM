services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "0.0.0.0:8080:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - ingress
      - llm_internal
    depends_on:
      - llm

  llm:
    image: ghcr.io/anbeeld/beellama.cpp:server-cuda13
    pull_policy: missing
    restart: unless-stopped
    command: >-
      --host 0.0.0.0
      --port 8080
      --alias qwen-uncensored
      --model /models/Qwen3.8-27B-Uncensored-Q4_K_M.gguf
      --model-draft /models/Qwen3.8-27B-DFlash2-Q4_K_M.gguf
      --spec-type draft-dflash
      --spec-draft-ngl all
      --spec-draft-n-max 7
      --n-gpu-layers all
      --parallel 1
      --ctx-size 160000
      --kv-unified
      --batch-size 2048
      --ubatch-size 512
      --flash-attn on
      --cache-type-k kvarn5
      --cache-type-v kvarn4
      --kv-tail-tokens 1024
      --load-mode dio
      --no-host
      --jinja
      --chat-template-file /models/Qwen-sharp.jinja
      --reasoning on
      --temp 1.0
      --top-k 20
      --top-p 0.95
      --min-p 0.0
      --sleep-idle-seconds 900
    gpus: all
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    expose:
      - "8080"
    shm_size: 16gb
    ulimits:
      memlock: -1
      stack: 67108864
    volumes:
      - ./models:/models:ro
    networks:
      - llm_internal

networks:
  ingress:
  llm_internal:
    internal: true

version = 1

[*]
n-gpu-layers = all
parallel = 1
kv-unified = true
batch-size = 2048
ubatch-size = 512
flash-attn = on
jinja = true
load-mode = mlock
no-host = true
load-on-startup = false
stop-timeout = 30
sleep-idle-seconds = 900

[qwen-uncensored]
model = /models/Qwen3.8-27B-Uncensored-Q4_K_M.gguf
model-draft = /models/Qwen3.8-27B-DFlash2-Q4_K_M.gguf
spec-type = draft-dflash
spec-draft-ngl = all
spec-draft-n-max = 7
ctx-size = 160000
cache-type-k = kvarn5
cache-type-v = kvarn4
kv-tail-tokens = 1024
reasoning = on
reasoning-effort = xhigh
temp = 1.0
top-k = 20
top-p = 0.95
min-p = 0.0

[qwen3.8]
model = /models/Qwen3.8-27B-UD-Q4_K_M.gguf
model-draft = /models/Qwen3.8-27B-DFlash2-Q4_K_M.gguf
spec-type = draft-dflash
spec-draft-ngl = all
spec-draft-n-max = 7
ctx-size = 160000
cache-type-k = kvarn5
cache-type-v = kvarn4
kv-tail-tokens = 1024
reasoning = on
reasoning-effort = xhigh
temp = 1.0
top-k = 20
top-p = 0.95
min-p = 0.0
